<title>우리집 장보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 위에 추가 칸, 아래 카테고리 카드 2열 (폰에서는 1열) */
  :root {
    --bg: #F7F5EC;
    --card: #FFFFFF;
    --green: #4C8B3F;
    --green-soft: #E6F0E1;
    --on-green: #FFFFFF;
    --text: #2B2F27;
    --muted: #8A8F84;
    --line: #ECEAE0;
    --danger: #C0533F;
    --danger-soft: #F8E9E5;
    --shadow: rgba(60, 70, 40, .08);
    --font-display: "Jua", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171B15; --card: #22281F; --green: #7DBF6C; --green-soft: #2C3A27; --on-green: #11160F;
      --text: #E8EBE3; --muted: #8E9688; --line: #313829; --danger: #E58A76; --danger-soft: #3A2622;
      --shadow: rgba(0, 0, 0, .3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171B15; --card: #22281F; --green: #7DBF6C; --green-soft: #2C3A27; --on-green: #11160F;
    --text: #E8EBE3; --muted: #8E9688; --line: #313829; --danger: #E58A76; --danger-soft: #3A2622;
    --shadow: rgba(0, 0, 0, .3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 960px; margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 16px; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 32px; color: var(--green); text-wrap: balance; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live::before { background: var(--green); }

  .add {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--card); padding: 12px; border-radius: 16px;
    box-shadow: 0 2px 8px var(--shadow);
    margin: 0 0 20px;
  }
  .add input, .add select, .add button {
    font: inherit; border-radius: 10px; padding: 10px 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .add input { flex: 1 1 200px; min-width: 0; }
  .add input:focus-visible, .add select:focus-visible, .add button:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  .add button { background: var(--green); color: var(--on-green); border: none; font-weight: 700; cursor: pointer; }
  .add button:hover { filter: brightness(1.08); }
  .add :disabled { opacity: .5; cursor: not-allowed; }

  .notice { margin: -8px 0 20px; font-size: 14px; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--card); border-radius: 18px; padding: 16px 16px 8px; box-shadow: 0 2px 8px var(--shadow); min-width: 0; }
  .card h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  .count { font-size: 13px; font-weight: 500; color: var(--green); background: var(--green-soft); padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  li label { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; min-width: 0; }
  li input[type="checkbox"] {
    appearance: none; flex: none; width: 24px; height: 24px; margin: 0;
    border: 2px solid var(--green); border-radius: 7px; cursor: pointer;
    display: grid; place-content: center; background: var(--card);
  }
  li input[type="checkbox"]::after {
    content: ""; width: 6px; height: 12px; margin-top: -3px;
    border: solid var(--on-green); border-width: 0 3px 3px 0; transform: rotate(45deg); opacity: 0;
  }
  li input[type="checkbox"]:checked { background: var(--green); }
  li input[type="checkbox"]:checked::after { opacity: 1; }
  li input[type="checkbox"]:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  li input[type="checkbox"]:disabled { cursor: default; opacity: .6; }
  li .name { overflow-wrap: anywhere; }
  li.done .name { text-decoration: line-through; color: var(--muted); }
  .del {
    flex: none; border: none; background: none; cursor: pointer;
    color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 8px; opacity: 0;
  }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--danger); background: var(--danger-soft); }
  .del:focus-visible { outline: 2px solid var(--danger); }
  @media (hover: none) { .del { opacity: 1; } }
  .readonly .del { display: none; }
  li.empty { color: var(--muted); font-size: 14px; }
</style>

<div class="wrap" id="app">
  <header>
    <h1>🥬 우리집 장보기</h1>
    <span class="status" id="status">목록을 불러오는 중이에요</span>
  </header>

  <form class="add" id="addForm">
    <input id="nameInput" type="text" placeholder="살 것을 적어 주세요 (예: 양배추)" autocomplete="off" aria-label="품목 이름" disabled>
    <select id="catSelect" aria-label="카테고리" disabled></select>
    <button id="addButton" type="submit" disabled>추가</button>
  </form>
  <p class="notice" id="notice" hidden></p>

  <div class="grid" id="grid"></div>
</div>

<script>
  const CATEGORIES = [
    { id: "veg",   label: "🥕 채소·과일" },
    { id: "meat",  label: "🥩 고기·생선" },
    { id: "dairy", label: "🥛 유제품·달걀" },
    { id: "home",  label: "🧻 생활용품" },
  ];

  const app = document.getElementById("app");
  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  const noticeEl = document.getElementById("notice");
  const catSelect = document.getElementById("catSelect");
  const nameInput = document.getElementById("nameInput");
  const addButton = document.getElementById("addButton");

  for (const cat of CATEGORIES) {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.label;
    catSelect.appendChild(opt);
  }

  let items = [];       // { id, name, cat, done, createdAt }
  let loaded = false;
  let canWrite = false;
  let col = null;       // db.collection("items")

  function setStatus(text, live) {
    statusEl.textContent = text;
    statusEl.classList.toggle("live", !!live);
  }

  function showNotice(text) {
    noticeEl.textContent = text;
    noticeEl.hidden = !text;
  }

  function setWritable(on) {
    canWrite = on;
    nameInput.disabled = catSelect.disabled = addButton.disabled = !on;
    app.classList.toggle("readonly", !on);
    render();
  }

  function render() {
    grid.innerHTML = "";
    for (const cat of CATEGORIES) {
      // 안 산 것 먼저, 산 것은 아래로 (같은 그룹 안에서는 넣은 순서 유지)
      const list = items.filter(i => i.cat === cat.id).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const sorted = [...list.filter(i => !i.done), ...list.filter(i => i.done)];
      const left = list.filter(i => !i.done).length;

      const card = document.createElement("section");
      card.className = "card";
      card.innerHTML = `<h2><span></span><span class="count"></span></h2><ul></ul>`;
      card.querySelector("h2 span").textContent = cat.label;
      card.querySelector(".count").textContent = `남은 것 ${left}개`;
      const ul = card.querySelector("ul");

      if (sorted.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = loaded ? "아직 항목이 없어요. 위 칸에서 추가해 보세요" : "불러오는 중…";
        ul.appendChild(li);
      }

      for (const item of sorted) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const label = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = item.done;
        box.disabled = !canWrite;
        box.addEventListener("change", () => write(col.doc(item.id).update({ done: box.checked })));
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;
        label.append(box, name);

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.title = "삭제";
        del.setAttribute("aria-label", `${item.name} 삭제`);
        del.textContent = "×";
        del.addEventListener("click", () => write(col.doc(item.id).delete()));

        li.append(label, del);
        ul.appendChild(li);
      }
      grid.appendChild(card);
    }
  }

  async function write(promise) {
    try {
      await promise;
      showNotice("");
    } catch (e) {
      if (e && e.code === "invalid_argument") {
        setWritable(false);
        showNotice("이 목록은 보기만 할 수 있어요. 고치려면 목록 주인에게 편집 권한을 받아 주세요.");
      } else if (e && e.code === "quota_exceeded") {
        showNotice("항목이 너무 많아서 더 추가할 수 없어요. 산 항목을 몇 개 지워 주세요.");
      } else {
        showNotice("저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
      }
    }
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name || !col) { nameInput.focus(); return; }
    write(col.add({ name, cat: catSelect.value, done: false, createdAt: Date.now() }));
    nameInput.value = "";
    nameInput.focus();
  });

  render();

  (async () => {
    const db = await claude.use("db");
    if (!db) {
      setStatus("공유 목록에 연결하지 못했어요");
      showNotice("claude.ai에 로그인한 상태에서 링크를 열어 주세요.");
      return;
    }
    col = db.collection("items");

    const user = await claude.use("user");
    const may = user ? await user.can("data.write") : null;
    // null이면 플랫폼이 알려 주지 않은 것이므로 일단 입력을 열어 두고, 저장이 거절되면 그때 막는다
    setWritable(may !== false);
    if (may === false) showNotice("이 목록은 보기만 할 수 있어요. 고치려면 목록 주인에게 편집 권한을 받아 주세요.");

    col.onSnapshot(snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded = true;
      setStatus("가족과 함께 보는 중", true);
      render();
    }, () => {
      setStatus("연결이 끊겼어요. 새로고침해 주세요");
    });
  })();
</script>
